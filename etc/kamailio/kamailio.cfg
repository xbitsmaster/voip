#!KAMAILIO
#
# Kamailio配置文件
# 实现: UA1 -> Kamailio -> FreeSWITCH -> Kamailio -> UA2
#

####### 全局参数 #######

#!define DBURL "mysql://voip:voip_password@voip-mysql/voip"

# FreeSWITCH地址
#!define FREESWITCH_IP "voip-freeswitch"
#!define FREESWITCH_PORT "5080"

# 调试级别 (1=低, 3=高)
debug=2
log_stderror=no
log_facility=LOG_LOCAL0

# 分叉子进程
fork=yes
children=4

# 端口和协议
port=5060
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

# 生命周期
auto_aliases=no

####### 模块加载 #######

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "nathelper.so"
loadmodule "rtpproxy.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "db_mysql.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "tmx.so"

####### 模块参数 #######

# ----- tm params -----
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

# ----- rr params -----
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

# ----- usrloc params -----
modparam("usrloc", "db_url", DBURL)
modparam("usrloc", "db_mode", 2)

# ----- auth_db params -----
modparam("auth_db", "db_url", DBURL)
modparam("auth_db", "calculate_ha1", 1)
modparam("auth_db", "password_column", "password")
modparam("auth_db", "load_credentials", "")

# ----- registrar params -----
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "default_expires", 600)

####### 路由逻辑 #######

# 主请求路由
request_route {
    # 日志记录
    xlog("L_INFO", "[$ci] $rm from $fu to $ru (src: $si:$sp)\n");

    # 最大转发检查
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # 消息完整性检查
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP message from $si:$sp\n");
        exit;
    }

    # CANCEL处理
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # 处理重传
    if (!is_method("ACK")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    # REGISTER处理 - 在loose_route之前处理，避免循环
    if (is_method("REGISTER")) {
        # 移除Route头（如果有）
        remove_hf("Route");
        route(REGISTRAR);
        exit;
    }

    # 处理路由头中的请求
    if (loose_route()) {
        if (is_method("BYE")) {
            # 记录呼叫结束
            xlog("L_INFO", "[$ci] BYE - call ended\n");
        }
        route(RELAY);
        exit;
    }

    # 记录路由
    if (!is_method("REGISTER|MESSAGE")) {
        record_route();
    }

    # 判断请求来源
    if ($si == FREESWITCH_IP) {
        # 来自FreeSWITCH的请求，路由到目标UA
        xlog("L_INFO", "[$ci] Request from FreeSWITCH, routing to UA\n");
        route(LOCATION);
        exit;
    }

    # 来自UA的INVITE请求，转发到FreeSWITCH
    if (is_method("INVITE")) {
        xlog("L_INFO", "[$ci] INVITE from UA, routing to FreeSWITCH\n");
        route(TO_FREESWITCH);
        exit;
    }

    # 其他请求，尝试查找位置
    route(LOCATION);
}

# 转发到FreeSWITCH
route[TO_FREESWITCH] {
    # 设置目标为FreeSWITCH
    $ru = "sip:" + $rU + "@" + FREESWITCH_IP + ":" + FREESWITCH_PORT;
    xlog("L_INFO", "[$ci] Forwarding to FreeSWITCH: $ru\n");

    route(RELAY);
}

# 位置查询路由
route[LOCATION] {
    # 查找用户位置
    if (!lookup("location")) {
        # 用户未注册
        xlog("L_WARN", "[$ci] User $rU not found\n");
        sl_send_reply("404", "Not Found");
        exit;
    }

    xlog("L_INFO", "[$ci] Found user, routing to: $ru\n");
    route(RELAY);
}

# 注册处理路由
route[REGISTRAR] {
    # 可选：添加认证
    # if (!auth_check("$fd", "subscriber", "1")) {
    #     auth_challenge("$fd", "0");
    #     exit;
    # }

    if (!save("location")) {
        sl_reply_error();
    }
    exit;
}

# 中继路由
route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# 响应处理
onreply_route {
    xlog("L_INFO", "[$ci] Reply: $rs $rr\n");
}

# 失败处理
failure_route[FAIL] {
    if (t_is_canceled()) {
        exit;
    }
    xlog("L_WARN", "[$ci] Call failed\n");
}
