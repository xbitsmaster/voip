#
# VoIP 部署配置文件
# 所有部署脚本共享此配置
#

# ============================================
# 网络配置
# ============================================
NETWORK_NAME="voip-network"

# ============================================
# 默认服务器配置
# ============================================
DEFAULT_SERVER="192.168.139.149"
DEFAULT_USER="root"
REMOTE_PATH="/opt/voip"

# ============================================
# MySQL 配置
# ============================================
MYSQL_CONTAINER="voip-mysql"
MYSQL_ROOT_PASSWORD="voip_root_password"
MYSQL_USER="voip"
MYSQL_PASSWORD="voip_password"
MYSQL_DATABASE="voip"
MYSQL_PORT="3306"
MYSQL_IMAGE="mysql:8.0"

# ============================================
# Kamailio 配置
# ============================================
KAMAILIO_CONTAINER="voip-kamailio"
KAMAILIO_SIP_PORT="5060"
KAMAILIO_TLS_PORT="5061"
KAMAILIO_JSONRPC_PORT="8080"
KAMAILIO_IMAGE="kamailio/kamailio-ci:latest"

# Kamailio HA 配置
KAMAILIO_VIP="192.168.139.100"
KAMAILIO_VIP_NETMASK="24"
KAMAILIO_VRRP_ID="51"
KAMAILIO_MASTER_PRIORITY="100"
KAMAILIO_BACKUP_PRIORITY="90"

# ============================================
# FreeSWITCH 配置
# ============================================
FREESWITCH_CONTAINER="voip-freeswitch"
FREESWITCH_SIP_PORT="5080"
FREESWITCH_ESL_PORT="8021"
FREESWITCH_ESL_PASSWORD="ClueCon"
FREESWITCH_IMAGE="safarov/freeswitch:latest"

# Dispatcher 组 ID (用于 FreeSWITCH 负载均衡)
DISPATCHER_GROUP_ID="1"

# ============================================
# 健康检查配置
# ============================================
HEALTH_CHECK_INTERVAL="5"
HEALTH_CHECK_TIMEOUT="3"
HEALTH_CHECK_RETRIES="3"

# ============================================
# 日志配置
# ============================================
LOG_LEVEL="info"
